<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FinishAI</title>
  <meta name="description" content="Sign in to FinishAI — your AI-powered project execution coach." />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260718_1" />
  <link rel="stylesheet" href="css/components.css?v=20260718_1" />
  <link rel="stylesheet" href="css/animations.css?v=20260718_1" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(13, 20, 38, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.5s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-text {
      font-size: 2rem;
      font-weight: 900;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider-text {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 12px;
    }

    .social-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }
  </style>
</head>
<body>
  <!-- Background orbs -->
  <div class="gradient-orb orb-1"></div>
  <div class="gradient-orb orb-2"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-text" style="display:inline-flex; align-items:center; gap:10px;"><img src="img/logo.png" class="app-logo-lg" alt="FinishAI" /> FinishAI</div>
      <div style="font-size: 0.9rem; color: var(--text-muted); margin-top: 6px">"Plan Less. Finish More."</div>
    </div>

    <h2 style="font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 8px">Welcome back</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 28px; font-size: 0.9rem">
      Sign in to access your projects and daily tasks.
    </p>

    <button class="social-btn" onclick="mockLogin('google')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <button class="social-btn" onclick="mockLogin('github')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      Continue with GitHub
    </button>

    <div class="divider-text"><span>or continue with email</span></div>

    <form id="login-form" onsubmit="handleEmailLogin(event)">
      <div class="form-group mb-16">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-input" id="login-name" placeholder="What should AI call you?" required />
      </div>
      <div class="form-group mb-20">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px" id="login-btn">
        ⚡ Get Started Free
      </button>
    </form>

    <p style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--text-muted)">
      No credit card required · Built for OpenAI Build Week 2026
    </p>

    <div style="text-align: center; margin-top: 16px">
      <a href="dashboard.html" style="font-size: 0.875rem; color: var(--primary)">Skip login → Go to Dashboard</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function mockLogin(provider) {
      const names = { google: 'Alex', github: 'Dev' };
      const name = names[provider] || 'User';
      localStorage.setItem('finishai-username', name);
      localStorage.setItem('finishai-email', `${name.toLowerCase()}@example.com`);
      window.App.showToast(`Welcome, ${name}! 👋`, 'Logging you in...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }

    function handleEmailLogin(e) {
      e.preventDefault();
      const name = document.getElementById('login-name').value.trim();
      const email = document.getElementById('login-email').value.trim();
      if (!name || !email) return;

      const btn = document.getElementById('login-btn');
      window.App.setButtonLoading(btn, true);

      localStorage.setItem('finishai-username', name);
      localStorage.setItem('finishai-email', email);

      setTimeout(() => {
        window.App.showToast(`Welcome, ${name}! 🚀`, 'Taking you to your dashboard...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      }, 600);
    }
  </script>
</body>
</html>
