<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Detail — FinishAI</title>
  <meta name="description" content="FinishAI Project View — milestones, tasks, AI insights, and re-planning." />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260718_1" />
  <link rel="stylesheet" href="css/components.css?v=20260718_1" />
  <link rel="stylesheet" href="css/animations.css?v=20260718_1" />
</head>
<body>
  <!-- FIXED TOP BAR -->
  <header class="topbar-fixed">
    <a href="index.html" style="text-decoration:none; color:inherit;" class="topbar-brand">
      <span>⚡ FinishAI</span>
    </a>
    
    <div class="topbar-right">
      <a href="daily.html" class="btn btn-ghost btn-sm">Focus Mode</a>
      <a href="projects.html" class="btn btn-ghost btn-sm">Projects</a>
      <button onclick="triggerReplan('manual')" class="btn btn-secondary btn-sm">🔄 Re-plan</button>
      <a href="roadmap.html" id="btn-roadmap" class="btn btn-primary btn-sm">Roadmap</a>
    </div>
  </header>

  <!-- FIXED BOTTOM DOCK -->
  <nav class="dock">
    <a href="dashboard.html" class="dock-item" data-label="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </a>
    <a href="daily.html" class="dock-item" data-label="Today">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </a>
    <a href="projects.html" class="dock-item active" data-label="Projects">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </a>
    <a href="roadmap.html" class="dock-item" data-label="Roadmap">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    </a>
    <a href="#" class="dock-item" data-label="Settings" onclick="window.App.showToast('Coming soon!','Settings panel coming next.','info'); return false;">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="page-content">

      <!-- PROJECT HEADER -->
      <div class="card mb-24 flex justify-between items-center flex-wrap gap-16">
        <div class="flex items-center gap-16 flex-wrap">
          <a href="projects.html" class="btn btn-ghost btn-sm">← Back</a>
          <div>
            <div class="flex items-center gap-12 flex-wrap mb-4">
              <h1 id="project-title" style="font-size: 20px; font-weight: 700; color: var(--text-primary);">Loading project...</h1>
              <span id="project-type-badge"></span>
              <span id="project-status-badge"></span>
            </div>
            <div class="text-secondary" style="font-size: 13px;" id="project-deadline"></div>
          </div>
        </div>

        <div class="flex items-center gap-16">
          <div id="progress-circle" class="progress-circle" style="min-width: 64px; height: 64px; position: relative;"></div>
        </div>
      </div>

      <!-- DELAY BANNER -->
      <div id="delay-banner" class="card mb-16" style="display: none; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); align-items: center; justify-content: space-between;">
        <div class="flex items-center gap-12">
          <span>⚠️</span>
          <span class="banner-msg" style="font-size: 13px; font-weight: 600; color: #EF4444;"></span>
        </div>
        <button class="btn btn-danger btn-sm" onclick="triggerReplan('delayed')">Auto Re-plan</button>
      </div>

      <!-- OVERVIEW STATS ROW -->
      <div class="grid-4 mb-24" id="project-content">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">—</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-completed">—</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-remaining">—</div>
          <div class="stat-label">Remaining</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-days">—</div>
          <div class="stat-label">Days Left</div>
        </div>
      </div>

      <!-- TABS -->
      <div class="filter-tabs mb-24">
        <button class="filter-tab active" id="tab-overview" onclick="switchTab('overview')">Overview</button>
        <button class="filter-tab" id="tab-timeline" onclick="switchTab('timeline')">Timeline</button>
        <button class="filter-tab" id="tab-tasks" onclick="switchTab('tasks')">Tasks</button>
        <button class="filter-tab" id="tab-insights" onclick="switchTab('insights')">AI Insights</button>
      </div>

      <!-- TAB 1: OVERVIEW -->
      <div class="tab-panel active" id="panel-overview">
        <div class="grid-2 gap-24" style="align-items: start;">
          <div>
            <h4 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">Milestones</h4>
            <div id="milestones-container" class="flex flex-col gap-12">
              <div class="card" style="height: 80px;"></div>
              <div class="card" style="height: 80px;"></div>
            </div>
          </div>
          <div class="flex flex-col gap-16">
            <div id="next-action-container"></div>
            <div id="coach-message"></div>

            <div id="motivation-card" style="display: none;">
              <div class="card" style="border-color: rgba(139,92,246,0.3);">
                <div class="section-label mb-8" style="color: var(--purple);">WHY THIS MATTERS</div>
                <p id="motivation-text" style="font-size: 13px; color: var(--text-secondary); margin: 0;"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB 2: TIMELINE -->
      <div class="tab-panel" id="panel-timeline">
        <div id="timeline-container">
          <div class="card mb-16" style="height: 100px;"></div>
          <div class="card mb-16" style="height: 100px;"></div>
        </div>
      </div>

      <!-- TAB 3: TASKS -->
      <div class="tab-panel" id="panel-tasks">
        <div class="filter-tabs mb-16" id="task-filters">
          <button class="filter-tab active" onclick="renderTasksTab('all'); setActiveFilter(this)">All</button>
          <button class="filter-tab" onclick="renderTasksTab('today'); setActiveFilter(this)">Today</button>
          <button class="filter-tab" onclick="renderTasksTab('week'); setActiveFilter(this)">This Week</button>
          <button class="filter-tab" onclick="renderTasksTab('completed'); setActiveFilter(this)">Completed</button>
          <button class="filter-tab" onclick="renderTasksTab('skipped'); setActiveFilter(this)">Skipped</button>
        </div>
        <div id="tasks-container" class="flex flex-col gap-8">
          <div class="card" style="height: 60px;"></div>
          <div class="card" style="height: 60px;"></div>
        </div>
      </div>

      <!-- TAB 4: AI INSIGHTS -->
      <div class="tab-panel" id="panel-insights">
        <div id="insights-container">
          <div class="card mb-16" style="height: 200px;"></div>
        </div>
        <div id="replan-results"></div>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/replan.js"></script>
  <script src="js/project.js"></script>
  <script>
    function setActiveFilter(btn) {
      document.querySelectorAll('#task-filters .filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
    }

    // Show motivation on load
    document.addEventListener('DOMContentLoaded', () => {
      // Will be populated after project loads
    });
  </script>
</body>
</html>
