<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects — FinishAI</title>
  <meta name="description" content="FinishAI — All your AI-powered projects in one place. Filter, track, and manage." />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260718_1" />
  <link rel="stylesheet" href="css/components.css?v=20260718_1" />
  <link rel="stylesheet" href="css/animations.css?v=20260718_1" />
  <style>
    .projects-container-centered {
      max-width: 1100px !important;
      margin: 0 auto !important;
    }
    #projects-grid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 12px !important;
    }
    @media (max-width: 992px) {
      #projects-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }
    @media (max-width: 600px) {
      #projects-grid {
        grid-template-columns: 1fr !important;
      }
    }
    .project-card {
      background: #0F1629 !important;
      border: 1px solid #1E2A45 !important;
      border-radius: 10px !important;
      padding: 16px 20px !important;
      transition: border-color 150ms ease, transform 150ms ease !important;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .project-card:hover {
      border-color: #2D3748 !important;
    }
    .project-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .project-card-title {
      font-size: 14px !important;
      font-weight: 700 !important;
      color: #F1F5F9 !important;
    }
    .project-card.on_track .badge { background: #0F2E1E !important; color: #10B981 !important; border: none !important; font-weight: 700 !important; }
    .project-card.at_risk .badge { background: #2E1E0F !important; color: #F59E0B !important; border: none !important; font-weight: 700 !important; }
    .project-card.behind .badge { background: #2E0F0F !important; color: #EF4444 !important; border: none !important; font-weight: 700 !important; }
    .progress-bar-container {
      margin: 12px 0 !important;
      height: 3px !important;
      background: #1E2A45 !important;
      border-radius: 99px !important;
      overflow: hidden !important;
    }
    .project-card.on_track .progress-bar-fill { background: #10B981 !important; height: 100% !important; }
    .project-card.at_risk .progress-bar-fill { background: #F59E0B !important; height: 100% !important; }
    .project-card.behind .progress-bar-fill { background: #EF4444 !important; height: 100% !important; }
    .project-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .project-card-footer span, .project-card-footer .badge {
      font-size: 12px !important;
      color: #64748B !important;
      background: transparent !important;
      padding: 0 !important;
      font-weight: 500 !important;
    }
  </style>
</head>
<body>
  <!-- FIXED TOP BAR (SAME AS DASHBOARD.HTML) -->
  <header class="topbar-fixed">
    <a href="dashboard.html" class="topbar-brand">
      <span>⚡ FinishAI</span>
    </a>
    <span id="user-name" style="display: none;">User</span>
    
    <div class="topbar-right">
      <a href="daily.html" class="btn btn-ghost btn-sm">Focus Mode</a>
      <a href="#" onclick="openManualModal(); return false;" class="btn btn-primary btn-sm">+ New Project</a>
      <div class="avatar-circle" id="user-avatar" title="Account">U</div>
    </div>
  </header>

  <!-- FIXED BOTTOM DOCK (SAME AS DASHBOARD.HTML) -->
  <nav class="dock">
    <a href="dashboard.html" class="dock-item" data-label="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </a>
    <a href="daily.html" class="dock-item" data-label="Today">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </a>
    <a href="projects.html" class="dock-item active" data-label="Projects">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </a>
    <a href="roadmap.html" class="dock-item" data-label="Roadmap">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    </a>
    <a href="#" class="dock-item" data-label="Settings" onclick="window.App.showToast('Coming soon!','Settings panel coming next.','info'); return false;">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2-2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="page-content projects-container-centered">

      <!-- TOP SECTION: Title, Subtext, Search & Filter Pills -->
      <div class="flex justify-between items-center mb-24 flex-wrap gap-16" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 20px;">
        <div>
          <h1 style="font-size: 20px; font-weight: 700; color: #F1F5F9; letter-spacing: -0.02em; margin: 0;">My Projects</h1>
          <div id="projects-count-text" class="text-muted" style="font-size: 13px; margin-top: 4px;">Loading...</div>
        </div>
        
        <div class="flex items-center gap-12 flex-wrap">
          <div class="filter-tabs" id="filter-bar" style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 4px;">
            <button class="filter-tab active" onclick="filterProjects('all', this)">All</button>
            <button class="filter-tab" onclick="filterProjects('on_track', this)">On Track</button>
            <button class="filter-tab" onclick="filterProjects('at_risk', this)">At Risk</button>
            <button class="filter-tab" onclick="filterProjects('behind', this)">Behind</button>
          </div>
          <input
            type="text"
            id="search-input"
            class="form-input"
            placeholder="Search projects..."
            oninput="searchProjects(this.value)"
            style="width: 220px; padding: 8px 14px; font-size: 13px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-primary);"
          />
        </div>
      </div>

      <!-- PROJECTS GRID (3 COLUMN ON DESKTOP) -->
      <div id="projects-grid" style="gap: 12px;">
        <div class="card" style="height: 180px;"></div>
        <div class="card" style="height: 180px;"></div>
        <div class="card" style="height: 180px;"></div>
      </div>

    </div>   </div>

    <!-- MANUAL PROJECT MODAL -->
    <div id="manual-project-modal" style="display: none;">
      <div class="modal-overlay" onclick="if(event.target===this)closeManualModal()">
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">Create Project Manually</h3>
            <button class="modal-close" onclick="closeManualModal()">✕</button>
          </div>
          <div class="flex flex-col gap-12">
            <div class="form-group">
              <label class="form-label">Project Name</label>
              <input type="text" class="form-input" id="man-name" placeholder="e.g. Learn Python" />
            </div>
            <div class="form-group">
              <label class="form-label">Goal / Description</label>
              <textarea class="form-textarea" id="man-desc" rows="3" placeholder="Describe your goal..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Project Type</label>
              <select class="form-select" id="man-type">
                <option value="study">Study / Learning</option>
                <option value="work">Work / SaaS</option>
                <option value="personal">Personal Goal</option>
              </select>
            </div>
            <div class="grid-2 gap-12">
              <div class="form-group">
                <label class="form-label">Deadline</label>
                <input type="date" class="form-input" id="man-deadline" />
              </div>
              <div class="form-group">
                <label class="form-label">Daily Hours (<span id="man-hours-val">2</span>h)</label>
                <input type="range" id="man-hours" min="0.5" max="8" step="0.5" value="2" oninput="document.getElementById('man-hours-val').textContent=this.value" style="margin-top: 8px;" />
              </div>
            </div>
            <button class="btn btn-primary mt-12" id="man-submit" onclick="submitManualProject()" style="width: 100%;">
              Generate Roadmap →
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- /MANUAL PROJECT MODAL -->

  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allProjects = [];
    let currentFilter = 'all';
    let currentSearch = '';

    document.addEventListener('DOMContentLoaded', async () => {
      const name = localStorage.getItem('finishai-username') || 'there';
      const av = document.getElementById('user-avatar');
      const un = document.getElementById('user-name');
      if (av) av.textContent = name.charAt(0).toUpperCase();
      if (un) un.textContent = name;
      await loadProjects();
    });

    async function loadProjects() {
      try {
        const data = await window.API.getProjects();
        allProjects = data.projects || [];
        document.getElementById('projects-count-text').textContent =
          allProjects.length
            ? `${allProjects.length} project${allProjects.length !== 1 ? 's' : ''} total`
            : 'No projects yet — create one with the AI chat!';
        applyFilters();
      } catch (err) {
        document.getElementById('projects-grid').innerHTML = `
          <div style="grid-column:1/-1">
            <div class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <div class="empty-state-title">Backend not connected</div>
              <p class="empty-state-subtitle">Make sure the FastAPI server is running on port 8000.<br>${err.message}</p>
              <button class="btn btn-primary mt-16" onclick="loadProjects()">Retry</button>
            </div>
          </div>
        `;
      }
    }

    function filterProjects(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyFilters();
    }

    function searchProjects(val) {
      currentSearch = val.toLowerCase().trim();
      applyFilters();
    }

    function applyFilters() {
      let filtered = currentFilter === 'all'
        ? allProjects
        : allProjects.filter(p => p.status === currentFilter);

      if (currentSearch) {
        filtered = filtered.filter(p =>
          p.name.toLowerCase().includes(currentSearch) ||
          (p.description || '').toLowerCase().includes(currentSearch)
        );
      }
      renderProjects(filtered);
    }

    function renderProjects(projects) {
      const grid = document.getElementById('projects-grid');
      if (!projects.length) {
        grid.innerHTML = `
          <div style="grid-column:1/-1">
            <div class="empty-state" style="margin: 40px auto; text-align: center;">
              <div class="empty-state-icon" style="font-size: 48px; margin-bottom: 12px;">🚀</div>
              <div class="empty-state-title" style="font-size: 18px; font-weight: 700; color: #F1F5F9;">No projects yet</div>
              <p class="empty-state-subtitle" style="font-size: 13px; color: #64748B; margin-bottom: 20px;">
                ${currentSearch ? `No results for "${currentSearch}"` : 'Create your first AI-powered project to get started!'}
              </p>
              <div style="display: flex; gap: 12px; justify-content: center;">
                <a href="dashboard.html" class="btn btn-primary">Start with AI Chat →</a>
                <button onclick="openManualModal()" class="btn btn-ghost">Manual Entry</button>
              </div>
            </div>
          </div>
        `;
        return;
      }
      grid.innerHTML = projects.map(p => renderProjectCard(p)).join('');
    }

    function renderProjectCard(project) {
      const stats = project.stats || {};
      const days = window.App.daysRemaining(project.deadline);
      const pct = stats.actual_percent || 0;
      const status = project.status || 'on_track';
      return `
        <div class="project-card ${status}" onclick="window.location.href='project.html?id=${project.id}'">
          <!-- TOP ROW: emoji + title + status badge -->
          <div class="project-card-header" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">
              <span class="project-card-emoji" style="font-size: 18px;">${project.emoji || '📋'}</span>
              <span class="project-card-title" style="font-size: 14px; font-weight: 700; color: #F1F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${project.name}</span>
            </div>
            <div>${window.App.statusBadge(status)}</div>
          </div>

          ${project.description ? `
            <div style="font-size: 13px; color: var(--text-muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 6px;">
              ${project.description}
            </div>
          ` : ''}

          <!-- PROGRESS BAR -->
          <div class="progress-bar-container" style="margin: 12px 0; height: 3px; background: #1E2A45; border-radius: 99px; overflow: hidden;">
            <div class="progress-bar-fill" style="width: ${pct}%;"></div>
          </div>

          <!-- MIDDLE ROW -->
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748B; margin-bottom: 14px;">
            <span>${stats.remaining_tasks || 0} tasks remaining</span>
            <span>${days > 0 ? days + ' days left' : 'Deadline passed'}</span>
          </div>

          <!-- BOTTOM ROW -->
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 12px;">
            <button class="btn btn-ghost btn-sm" onclick="window.location.href='project.html?id=${project.id}'" style="padding: 4px 8px; font-size: 12px;">View Project →</button>
            <button class="btn btn-ghost btn-sm text-danger" onclick="event.stopPropagation(); deleteProject('${project.id}')" style="padding: 4px 8px; font-size: 12px; color: #EF4444;">Delete</button>
          </div>
        </div>
      `;
    }

    async function deleteProject(id) {
      if (!confirm('Delete this project and all its tasks? This cannot be undone.')) return;
      try {
        await window.API.deleteProject(id);
        window.App.showToast('Project deleted', '', 'success');
        await loadProjects();
      } catch (err) {
        window.App.showToast('Delete failed', err.message, 'error');
      }
    }

    function showToast(t, m, ty) { window.App.showToast(t, m, ty); }

    // Manual Modal Logic
    function openManualModal() {
      document.getElementById('manual-project-modal').style.display = 'block';
    }
    function closeManualModal() {
      document.getElementById('manual-project-modal').style.display = 'none';
    }
    async function submitManualProject() {
      const name = document.getElementById('man-name').value.trim();
      const desc = document.getElementById('man-desc').value.trim();
      const type = document.getElementById('man-type').value;
      const deadline = document.getElementById('man-deadline').value;
      const hours = parseFloat(document.getElementById('man-hours').value);

      if (!name || !desc || !deadline) {
        showToast('Error', 'Please fill in all fields.', 'error');
        return;
      }

      const btn = document.getElementById('man-submit');
      const origText = btn.innerHTML;
      btn.innerHTML = '⏳ Generating...';
      btn.disabled = true;

      try {
        await window.API.createProject({
          name: name,
          description: desc,
          type: type,
          deadline: deadline,
          daily_hours: hours
        });
        showToast('Success', 'Project roadmap generated!', 'success');
        closeManualModal();
        await loadProjects();
        // Clear form
        document.getElementById('man-name').value = '';
        document.getElementById('man-desc').value = '';
        document.getElementById('man-deadline').value = '';
      } catch (err) {
        showToast('Generation Failed', err.message, 'error');
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
